name: alvy_app
description: ALVY E-commerce Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  
  # State Management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^13.0.0
  
  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0
  http_parser: ^4.0.2
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Utils
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  image_picker: ^1.2.2
  file_picker: ^11.0.3
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  # image 4.11 needs a newer archive than this Flutter SDK resolves (decodeLazy); 4.5.4 works with pdf/printing.
  image: 4.5.4
  geolocator: 14.0.2
  mobile_scanner: 7.0.1
  url_launcher: 6.3.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  image_picker_platform_interface: ^2.11.1
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
